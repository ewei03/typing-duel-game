name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install
        run: npm ci --prefix server && npm ci --prefix client

      - name: Typecheck
        run: npm run typecheck --prefix server && npm run typecheck --prefix client

      - name: Test
        run: npm test --prefix server && npm test --prefix client

      - name: Build
        run: npm run build --prefix server && npm run build --prefix client

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t typeoff .

      # Boots the image and waits for the health check, so a broken start
      # command or missing file fails here instead of on deploy.
      - name: Smoke test
        run: |
          docker run -d --name typeoff -p 3001:3001 typeoff
          for i in $(seq 1 20); do
            if curl -fs http://localhost:3001/api/health; then
              curl -fs http://localhost:3001/ | grep -q '<div id="root">' && exit 0
            fi
            sleep 1
          done
          docker logs typeoff
          exit 1
